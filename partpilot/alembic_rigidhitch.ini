[alembic]
# Path to migration scripts
script_location = alembic_rigidhitch

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for the "Create Date" comment in generated revisions
timezone = UTC

# sys.path additions so `alembic_rigidhitch.*` imports resolve when Alembic
# is invoked from the project root
prepend_sys_path = .

# The DB URL is deliberately left unset here: alembic_rigidhitch/env.py
# reads it from the RIGIDHITCH_DATABASE_URL environment variable instead,
# so it is never confused with PartPilot's own DATABASE_URL.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
